name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  detector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install inference dependencies
        run: pip install numpy scipy onnxruntime soundfile pytest
      - name: Detector regression tests
        run: pytest -q

  # The package must build and work when installed into a clean environment (not only from the checkout).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build the wheel
        run: |
          pip install build
          python -m build --outdir "$RUNNER_TEMP/dist" .
      - name: Install it in a clean environment and detect
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"   # not the checkout, so the installed package is what runs
          "$RUNNER_TEMP/venv/bin/python" -m kalki_wakeword "$GITHUB_WORKSPACE/docs/clips/hey-kalki-1.wav"
          if "$RUNNER_TEMP/venv/bin/python" -m kalki_wakeword "$GITHUB_WORKSPACE/docs/clips/hey-google.wav"; then echo "::error::fired on hey-google"; exit 1; fi

  # The JavaScript package: same clips and the same detection times/probabilities as the Python package.
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and test
        working-directory: js
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Check what would be published
        working-directory: js
        run: npm pack --dry-run

