name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  detector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install inference dependencies
        run: pip install numpy scipy onnxruntime soundfile pytest
      - name: Detector regression tests
        run: pytest -q
