name: retrain

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Training steps
        default: "6000"
      phrase:
        description: Wake phrase (empty = built-in "hey kalki" data)
        default: ""
      per_voice:
        description: Clips per voice per class for gen_tts.py
        default: "12"
      piper_voices:
        description: "Space-separated Piper model names for a second TTS source (empty = off). Check each voice's licence. e.g. en_GB-vctk-medium en_US-libritts_r-medium"
        default: ""
      piper_speakers:
        description: Speakers to use per multi-speaker Piper model
        default: "30"
      train_args:
        description: "Extra train.py flags, e.g. --specaugment --ema 0.999 --label-smoothing 0.05 (empty = defaults)"
        default: ""
      mine_rounds:
        description: Hard-negative mining rounds (0 = off). Each round mines false triggers from the corpus, then retrains
        default: "1"
      corpus_url:
        description: tar.gz of audio WITHOUT the wake word to mine (default LibriSpeech dev-clean, ~5 h, CC BY 4.0)
        default: "https://www.openslr.org/resources/12/dev-clean.tar.gz"
      real_clips_url:
        description: Optional zip of consented real recordings (positive/ and negative/ folders) to train on, 20x weight
        default: ""
      noise_url:
        description: Optional tar.gz or zip of real background-noise wavs for augmentation. Check the licence (ESC-50 is non-commercial, MUSAN is CC BY but 11 GB)
        default: ""

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r <(grep -viE '^(torch|sounddevice)' requirements.txt)
      # Synthesized clips are cached so reruns do not hit the (unofficial) edge-tts service again.
      # Cache keys cannot contain commas or spaces, so build a clean one from the inputs.
      - name: Cache key
        id: key
        env:
          PHRASE: ${{ inputs.phrase }}
          PER_VOICE: ${{ inputs.per_voice }}
          PIPER: ${{ inputs.piper_voices }}
          SPEAKERS: ${{ inputs.piper_speakers }}
        run: |
          clean() { printf '%s' "$1" | tr -c 'A-Za-z0-9.-' '_'; }
          k="$(clean "$PHRASE")-$PER_VOICE"
          [ -n "$PIPER" ] && k="$k-piper-$(clean "$PIPER")-$SPEAKERS"
          echo "k=$k" >> "$GITHUB_OUTPUT"
      - name: Restore TTS clips
        uses: actions/cache@v4
        with:
          path: data
          key: tts-${{ hashFiles('gen_tts.py', 'gen_piper.py') }}-${{ steps.key.outputs.k }}
      - name: Generate clips
        env:
          PHRASE: ${{ inputs.phrase }}
          PER_VOICE: ${{ inputs.per_voice }}
        run: python gen_tts.py --per-voice "$PER_VOICE" ${PHRASE:+--phrase "$PHRASE"}
      - name: Fetch the frozen evaluation set (if published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python eval_set.py fetch
      - name: Second TTS source (Piper)
        if: inputs.piper_voices != ''
        env:
          PIPER: ${{ inputs.piper_voices }}
          SPEAKERS: ${{ inputs.piper_speakers }}
          PER_VOICE: ${{ inputs.per_voice }}
          PHRASE: ${{ inputs.phrase }}
        run: |
          pip install piper-tts
          python -m piper.download_voices --download-dir piper_models $PIPER
          python gen_piper.py --models-dir piper_models --voices $PIPER --speakers "$SPEAKERS" --per-voice "$PER_VOICE" ${PHRASE:+--phrase "$PHRASE"}
      - name: Drop mined clips and noise left in the cache
        run: rm -rf data/noise data/negative/mined_* data/positive/pos_real_* data/negative/neg_real_*
      - name: Fetch real recordings
        if: inputs.real_clips_url != ''
        env:
          REAL_URL: ${{ inputs.real_clips_url }}
        run: |
          curl -fL --retry 3 -o real_clips.zip "$REAL_URL"
          python feedback_audio.py install --zip real_clips.zip
      - name: Fetch real noise for augmentation
        if: inputs.noise_url != ''
        env:
          NOISE_URL: ${{ inputs.noise_url }}
        run: |
          mkdir -p data/noise noise_dl
          curl -fL --retry 3 -o noise_dl/pack "$NOISE_URL"
          (cd noise_dl && (tar xf pack 2>/dev/null || unzip -q pack))
          find noise_dl -name '*.wav' -exec cp {} data/noise/ \;
          ls data/noise | wc -l
      - name: Fetch mining corpus
        if: inputs.mine_rounds != '0'
        env:
          CORPUS_URL: ${{ inputs.corpus_url }}
        run: |
          mkdir -p corpus
          curl -fL --retry 3 "$CORPUS_URL" | tar xz -C corpus
          find corpus -type f \( -name '*.flac' -o -name '*.wav' \) | wc -l
      - name: Train, quantize, mine hard negatives, repeat
        env:
          STEPS: ${{ inputs.steps }}
          ROUNDS: ${{ inputs.mine_rounds }}
          EXTRA: ${{ inputs.train_args }}
        run: |
          TRAIN_ARGS="--steps $STEPS $EXTRA"
          python train.py $TRAIN_ARGS
          python quantize.py
          for r in $(seq 1 "$ROUNDS"); do
            python mine_negatives.py --audio corpus --tag "r$r" --report "mining_r$r.json"
            python train.py $TRAIN_ARGS
            python quantize.py
          done
      # Score the new models on the same held-out voices as the PR gate, next to the committed baseline.
      - name: Compare with baseline
        run: |
          python ci_eval.py || true
          { echo "### Retrain vs baseline"; echo; cat ci_report.md; } >> "$GITHUB_STEP_SUMMARY"
      # Machine-readable results and the exact inputs of this run, so runs can be compared with summarize_runs.py.
      - name: Record run info
        env:
          RUN_INPUTS: ${{ toJSON(inputs) }}
          RUN_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          info = {"inputs": json.loads(os.environ["RUN_INPUTS"]), "sha": os.environ["RUN_SHA"], "run_id": os.environ["RUN_ID"]}
          json.dump(info, open("run_info.json", "w"), indent=1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retrain-report
          path: |
            ci_report.json
            ci_report.md
            run_info.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: kalki-onnx
          path: |
            models/kalki_fp32.onnx
            models/kalki_fp16.onnx
            models/kalki_int8.onnx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mining-report
          path: mining_r*.json
          if-no-files-found: ignore
