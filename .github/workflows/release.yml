name: release

# Push a tag like v0.3.0 (from a commit on main) to publish a GitHub Release with the model files,
# checksums and the scores they were measured at. A release fails if the models regress vs docs/baseline.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r <(grep -viE '^(torch|sounddevice)' requirements.txt)
      - name: Restore TTS clips
        uses: actions/cache@v4
        with:
          path: data
          key: tts-${{ hashFiles('gen_tts.py') }}--12
      - name: Generate clips (no-op when cached)
        run: python gen_tts.py --per-voice 12
      - name: Fetch the frozen evaluation set (if published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python eval_set.py fetch
      - name: Score the models
        run: python ci_eval.py
      - name: Build the Python package
        run: |
          # the tag must name the package version (tag v0.2.0 <-> kalki_wakeword.__version__ 0.2.0)
          V="$(python - <<'PY'
          import re
          print(re.search(r'__version__ = "([^"]+)"', open("kalki_wakeword/__init__.py").read()).group(1))
          PY
          )"
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package version $V"; exit 1; }
          JV="$(node -p "require('./js/package.json').version")"
          [ "$JV" = "$V" ] || { echo "::error::js/package.json version $JV does not match the Python package version $V"; exit 1; }
          pip install build
          python -m build --outdir pkg .
          (cd js && npm pack --pack-destination ../pkg)
      - name: Build release notes and checksums
        run: |
          mkdir -p dist
          cp models/kalki_int4.onnx models/kalki_int8.onnx models/kalki_fp16.onnx models/kalki_fp32.onnx pkg/*.whl pkg/*.tar.gz pkg/*.tgz dist/
          (cd dist && sha256sum *.onnx *.whl *.tar.gz *.tgz > SHA256SUMS.txt)
          kb() { echo $(( $(stat -c%s "$1") / 1024 )); }
          {
            echo "Wake word models for \`$GITHUB_REF_NAME\` (commit \`${GITHUB_SHA::7}\`)."
            echo
            echo "| file | size | use it for |"
            echo "|---|---:|---|"
            echo "| \`kalki_int4.onnx\` | $(kb dist/kalki_int4.onnx) KB | the smallest: 4-bit weights, needs onnxruntime 1.20 or newer (default in the packages) |"
            echo "| \`kalki_int8.onnx\` | $(kb dist/kalki_int8.onnx) KB | web pages and apps on any onnxruntime version |"
            echo "| \`kalki_fp16.onnx\` | $(kb dist/kalki_fp16.onnx) KB | GPUs and mobile NPUs |"
            echo "| \`kalki_fp32.onnx\` | $(kb dist/kalki_fp32.onnx) KB | reference; retraining and format conversion |"
            echo "| \`$(basename dist/*.whl)\` | $(kb dist/*.whl) KB | Python package: \`pip install <file>.whl\` |"
            echo "| \`$(basename dist/*.tgz)\` | $(kb dist/*.tgz) KB | JavaScript package: \`npm install ./<file>.tgz\` |"
            echo
            echo "### Scores on held-out synthetic voices"
            echo
            cat ci_report.md
            echo
            echo "Demo: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS.txt\`."
          } > RELEASE_NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
