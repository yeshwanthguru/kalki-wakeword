name: regression

on:
  pull_request:
    paths: ["*.py", "models/**", "docs/baseline.json", "requirements.txt", ".github/workflows/regression.yml"]

permissions:
  contents: write   # only used to commit docs/baseline.json when it is missing
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r <(grep -viE '^(torch|sounddevice)' requirements.txt)
      - name: Restore TTS clips
        uses: actions/cache@v4
        with:
          path: data
          key: tts-${{ hashFiles('gen_tts.py') }}--12
      - name: Generate clips (no-op when cached)
        run: python gen_tts.py --per-voice 12
      - name: Fetch the frozen evaluation set (if published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python eval_set.py fetch
      - name: Score committed models vs baseline
        id: gate
        run: python ci_eval.py
        continue-on-error: true
      # No baseline yet, or it was measured on a different evaluation set: record this PR's scores as the baseline (same-repo PRs).
      - name: Bootstrap docs/baseline.json
        if: (hashFiles('docs/baseline.json') == '' || hashFiles('ci_baseline_stale') != '') && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('ci_report.json') != ''
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          cp ci_report.json docs/baseline.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/baseline.json
          git commit -m "Record regression baseline from CI"
          git push origin "HEAD:refs/heads/$HEAD_REF"
      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '### Wake-word regression gate\n\n' + (fs.existsSync('ci_report.md') ? fs.readFileSync('ci_report.md', 'utf8') : 'ci_eval.py did not produce a report; see the job log.') + '\n\n<!-- kalki-regression -->';
            const {owner, repo} = context.repo, issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const old = comments.find(c => c.body.includes('<!-- kalki-regression -->'));
            if (old) await github.rest.issues.updateComment({owner, repo, comment_id: old.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
      - name: Fail on regression
        if: steps.gate.outcome == 'failure'
        run: exit 1
